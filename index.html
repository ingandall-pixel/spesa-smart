<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesa & Buoni Smart</title>
    <!-- Icona personalizzata per la schermata Home di iOS (PWA Badge Support) -->
    <link rel="apple-touch-icon" href="URL_DELLA_TUA_ICONA">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');
        .military-stamp {
            font-family: 'Special Elite', monospace;
            border: 4px solid #dc2626;
            color: #dc2626;
            padding: 4px 12px;
            text-transform: uppercase;
            font-size: 1.5rem;
            font-weight: bold;
            transform: rotate(-12deg);
            letter-spacing: 2px;
            box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.3);
            pointer-events: none;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); border-color: rgba(239, 68, 68, 1); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); border-color: rgba(239, 68, 68, 0.4); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); border-color: rgba(239, 68, 68, 1); }
        }
        .pulsing-border {
            animation: pulse-border 2s infinite;
            border-width: 3px !important;
        }
        .grayscale-img {
            filter: grayscale(100%);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Spesa-Smart 🛒</h1>
        <div class="flex gap-2">
            <button onclick="apriCestino()" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded text-sm font-medium transition">🗑️ Cestino</button>
            <button onclick="apriConfig()" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded text-sm font-medium transition">⚙️ Config</button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="max-w-md mx-auto mt-4 px-4 flex border-b border-slate-300">
        <button onclick="cambiaTab('spesa')" id="tab-spesa" class="flex-1 py-2 text-center font-semibold border-b-2 border-indigo-600 text-indigo-600">Spesa</button>
        <button onclick="cambiaTab('buoni')" id="tab-buoni" class="flex-1 py-2 text-center font-semibold text-slate-500 border-b-2 border-transparent">Buoni</button>
    </div>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4">
        
        <!-- Tab Spesa -->
        <div id="section-spesa" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm flex gap-2">
                <input type="text" id="nuovo-articolo" placeholder="Cosa serve? (es. Latte)" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="aggiungiSpesa()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition">Aggiungi</button>
            </div>
            <ul id="lista-spesa" class="space-y-2"></ul>
        </div>

        <!-- Tab Buoni -->
        <div id="section-buoni" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
                <!-- 1. Foto -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">1. Scatta o carica la foto del buono</label>
                    <input type="file" id="foto-buono" accept="image/*" capture="environment" onchange="analizzaData(this)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                    
                    <!-- Barra di caricamento OCR -->
                    <div id="ocr-container" class="hidden mt-3 space-y-1">
                        <div class="flex justify-between text-xs text-slate-500 font-medium">
                            <span id="status-ocr-text">Analisi immagine in corso...</span>
                            <span id="status-ocr-percent">0%</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div id="ocr-progress-bar" class="bg-indigo-600 h-2 w-0 transition-all duration-150"></div>
                        </div>
                    </div>
                </div>

                <!-- 2. Scadenza -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">2. Data di scadenza</label>
                    <input type="date" id="scadenza-buono" disabled oninput="verificaStatoSalva()" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-100 text-slate-400 cursor-not-allowed focus:outline-none">
                </div>

                <!-- 3. Titolo -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-slate-600">3. Titolo del buono</label>
                        <button type="button" id="btn-toggle-titolo" onclick="mostraSelectTitoli()" class="text-xs text-indigo-600 font-medium hover:underline hidden">Usa titoli esistenti</button>
                    </div>
                    <!-- Select rotazione iPhone -->
                    <select id="select-titolo" onchange="gestisciCambioTitolo(this)" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">Seleziona un titolo...</option>
                    </select>
                    <!-- Input testuale alternativo per nuovo titolo -->
                    <input type="text" id="input-titolo-nuovo" oninput="verificaStatoSalva()" placeholder="Es. Buono Famila 10€" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 hidden">
                </div>
                
                <button id="btn-salva-buono" onclick="aggiungiBuono()" disabled class="w-full bg-slate-300 text-slate-500 py-2 rounded-lg font-medium transition mt-2 cursor-not-allowed">Salva Buono</button>
            </div>
            <div id="lista-buoni" class="grid grid-cols-1 gap-4"></div>
        </div>
    </main>

    <!-- Modals -->
    <div id="modal-config" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
            <h2 class="text-lg font-bold">Configurazione GitHub</h2>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Username GitHub</label>
                <input type="text" id="cfg-user" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Nome Repository</label>
                <input type="text" id="cfg-repo" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Personal Access Token (PAT)</label>
                <input type="password" id="cfg-token" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="chiudiConfig()" class="flex-1 bg-slate-200 hover:bg-slate-300 py-2 rounded-lg text-sm font-medium">Annulla</button>
                <button onclick="salvaConfig()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-medium">Salva</button>
            </div>
        </div>
    </div>
    <div id="modal-img" class="fixed inset-0 bg-black/80 hidden flex flex-col items-center justify-center p-4 z-50" onclick="chiudiImmagine()">
        <img id="img-zoom" class="max-w-full max-h-[75vh] object-contain rounded-lg mb-4" src="">
        <button id="btn-elimina-buono" onclick="event.stopPropagation(); spostaNelCestinoCorrente()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-full font-medium shadow-lg transition">Elimina nel Cestino</button>
    </div>
    <div id="modal-cestino" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 shadow-xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-lg font-bold">🗑️ Cestino (Eliminazione automatica dopo 30gg)</h2>
                <button onclick="chiudiCestino()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>
            <div id="lista-cestino" class="overflow-y-auto flex-1 space-y-2"></div>
            <div class="pt-2 border-t flex justify-between">
                <button onclick="svuotaCestinoTotale()" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded-lg text-sm font-medium transition">Svuota Cestino</button>
                <button onclick="chiudiCestino()" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition">Chiudi</button>
            </div>
        </div>
    </div>

    <script>
        let dbData = { spesa: [], buoni: [], cestino: [] };
        let config = {
            user: localStorage.getItem('gh_user') || '',
            repo: localStorage.getItem('gh_repo') || '',
            token: localStorage.getItem('gh_token') || ''
        };
        let idBuonoSelezionato = null;

        document.addEventListener('DOMContentLoaded', () => {
            // Pulisce subito il badge all'ingresso nella pagina
            if ('clearAppBadge' in navigator) {
                navigator.clearAppBadge().catch(() => {});
            }

            if (!config.user || !config.repo || !config.token) {
                apriConfig();
            } else {
                caricaDatiDaGitHub();
            }
        });
        
        function verificaStatoSalva() {
            const select = document.getElementById('select-titolo');
            const inputNuovo = document.getElementById('input-titolo-nuovo');
            
            let titolo = '';
            if (!select.classList.contains('hidden')) {
                titolo = select.value && select.value !== '__nuovo__' ? select.value : '';
            } else {
                titolo = inputNuovo.value.trim();
            }

            const scadenza = document.getElementById('scadenza-buono').value;
            const fileInput = document.getElementById('foto-buono');
            const btnSalva = document.getElementById('btn-salva-buono');

            if (titolo && scadenza && fileInput.files.length > 0) {
                btnSalva.disabled = false;
                btnSalva.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-medium transition mt-2 cursor-pointer";
            } else {
                btnSalva.disabled = true;
                btnSalva.className = "w-full bg-slate-300 text-slate-500 py-2 rounded-lg font-medium transition mt-2 cursor-not-allowed";
            }
        }

        async function analizzaData(input) {
            const file = input.files[0];
            const scadenzaInput = document.getElementById('scadenza-buono');
            
            scadenzaInput.value = '';
            scadenzaInput.disabled = true;
            scadenzaInput.className = "w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-100 text-slate-400 cursor-not-allowed focus:outline-none";
            verificaStatoSalva();

            if (!file) return;

            const ocrContainer = document.getElementById('ocr-container');
            const progressBar = document.getElementById('ocr-progress-bar');
            const percentSpan = document.getElementById('status-ocr-percent');
            const statusText = document.getElementById('status-ocr-text');
            
            ocrContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            percentSpan.innerText = '0%';
            statusText.innerText = "Inizializzazione OCR...";

            try {
                const { data: { text } } = await Tesseract.recognize(file, 'ita+eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const percent = Math.round(m.progress * 100);
                            progressBar.style.width = `${percent}%`;
                            percentSpan.innerText = `${percent}%`;
                            statusText.innerText = "Riconoscimento testo in corso...";
                        }
                    }
                });
                
                scadenzaInput.disabled = false;
                scadenzaInput.className = "w-full border border-slate-300 rounded-lg px-3 py-2 bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500";

                let targetDateFound = null;
                const lines = text.split('\n');
                let allDates = [];

                lines.forEach(line => {
                    const lowLine = line.toLowerCase();
                    if (lowLine.includes('datetime') || lowLine.includes('lane')) {
                        return;
                    }

                    const dateRegex = /(\d{1,2})[\/\.\-\s](\d{1,2})[\/\.\-\s](\d{2,4})/g;
                    let match;
                    while ((match = dateRegex.exec(line)) !== null) {
                        let d = match[1].padStart(2, '0');
                        let m = match[2].padStart(2, '0');
                        let y = match[3];
                        if (y.length === 2) y = "20" + y;
                        let dateObj = new Date(`${y}-${m}-${d}`);
                        if (!isNaN(dateObj)) {
                            allDates.push({ d, m, y, dateObj, lineText: lowLine });
                        }
                    }
                });

                if (allDates.length > 0) {
                    let keywordMatch = allDates.find(item => 
                        item.lineText.includes('fino') || 
                        item.lineText.includes('al') || 
                        item.lineText.includes('valida') || 
                        item.lineText.includes('scadenza') || 
                        item.lineText.includes('entro') || 
                        item.lineText.includes('offerta')
                    );

                    if (keywordMatch) {
                        targetDateFound = keywordMatch;
                    } else {
                        allDates.sort((a, b) => a.dateObj - b.dateObj);
                        targetDateFound = allDates[allDates.length - 1];
                    }
                }

                if (targetDateFound) {
                    scadenzaInput.value = `${targetDateFound.y}-${targetDateFound.m}-${targetDateFound.d}`;
                    progressBar.style.width = '100%';
                    percentSpan.innerText = '100%';
                    statusText.innerText = "✅ Data di scadenza rilevata!";
                } else {
                    statusText.innerText = "⚠️ Data non trovata. Inseriscila manualmente.";
                }
                
                verificaStatoSalva();
            } catch (e) {
                console.error(e);
                statusText.innerText = "⚠️ Errore OCR.";
                scadenzaInput.disabled = false;
                scadenzaInput.className = "w-full border border-slate-300 rounded-lg px-3 py-2 bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500";
                verificaStatoSalva();
            }
        }

        function aggiungiBuono() {
            const select = document.getElementById('select-titolo');
            const inputNuovo = document.getElementById('input-titolo-nuovo');
            const titoloVal = !select.classList.contains('hidden') ? select.value : inputNuovo.value.trim();
            
            const scadenzaInput = document.getElementById('scadenza-buono');
            const fileInput = document.getElementById('foto-buono');
            
            if (!titoloVal || titoloVal === '__nuovo__' || fileInput.files.length === 0 || !scadenzaInput.value) return;
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Content = e.target.result.split(',')[1];
                const fileName = `images/buono_${Date.now()}_${file.name}`;
                const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${fileName}`;
                const headers = { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' };
                const body = { message: "Upload immagine buono", content: base64Content };
                const res = await fetch(url, { method: 'PUT', headers, body: JSON.stringify(body) });
                if(res.ok) {
                    const fileData = await res.json();
                    dbData.buoni.push({ id: Date.now(), titolo: titoloVal, scadenza: scadenzaInput.value, path: fileName, url: fileData.content.download_url });
                    
                    scadenzaInput.value = ''; fileInput.value = '';
                    document.getElementById('ocr-container').classList.add('hidden');
                    scadenzaInput.disabled = true; scadenzaInput.className = "w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-100 text-slate-400 cursor-not-allowed focus:outline-none";
                    
                    mostraSelectTitoli();
                    verificaStatoSalva();
                    await salvaDatiSuGitHub();
                    renderizzaBuoni();
                }
            };
            reader.readAsDataURL(file);
        }

        function aggiornaSelectTitoli() {
            const select = document.getElementById('select-titolo');
            if(!select) return;
            const titoliUnici = [...new Set(dbData.buoni.map(b => b.titolo))];
            
            select.innerHTML = '<option value="">Seleziona un titolo...</option>';
            titoliUnici.forEach(titolo => {
                select.innerHTML += `<option value="${titolo}">${titolo}</option>`;
            });
            select.innerHTML += `<option value="__nuovo__">➕ Inserisci nuovo titolo...</option>`;

            if (titoliUnici.length === 0) {
                mostraInputNuovoTitolo();
            }
        }

        function gestisciCambioTitolo(select) {
            if (select.value === '__nuovo__') {
                mostraInputNuovoTitolo();
            } else {
                verificaStatoSalva();
            }
        }

        function mostraInputNuovoTitolo() {
            const select = document.getElementById('select-titolo');
            const inputNuovo = document.getElementById('input-titolo-nuovo');
            const btnToggle = document.getElementById('btn-toggle-titolo');
            
            select.classList.add('hidden');
            select.value = '';
            inputNuovo.classList.remove('hidden');
            inputNuovo.value = '';
            inputNuovo.focus();
            
            if (dbData.buoni.length > 0) {
                btnToggle.classList.remove('hidden');
                btnToggle.innerText = "Usa titoli esistenti";
            }
            verificaStatoSalva();
        }

        function mostraSelectTitoli() {
            const select = document.getElementById('select-titolo');
            const inputNuovo = document.getElementById('input-titolo-nuovo');
            const btnToggle = document.getElementById('btn-toggle-titolo');
            
            inputNuovo.classList.add('hidden');
            inputNuovo.value = '';
            select.classList.remove('hidden');
            btnToggle.classList.add('hidden');
            
            aggiornaSelectTitoli();
            verificaStatoSalva();
        }

        function apriConfig() { document.getElementById('modal-config').classList.remove('hidden'); }
        function chiudiConfig() { document.getElementById('modal-config').classList.add('hidden'); }
        function salvaConfig() {
            config.user = document.getElementById('cfg-user').value.trim();
            config.repo = document.getElementById('cfg-repo').value.trim();
            config.token = document.getElementById('cfg-token').value.trim();
            localStorage.setItem('gh_user', config.user); localStorage.setItem('gh_repo', config.repo); localStorage.setItem('gh_token', config.token);
            chiudiConfig(); caricaDatiDaGitHub();
        }
        function cambiaTab(tab) {
            if(tab === 'spesa') { document.getElementById('section-spesa').classList.remove('hidden'); document.getElementById('section-buoni').classList.add('hidden'); document.getElementById('tab-spesa').className = "flex-1 py-2 text-center font-semibold border-b-2 border-indigo-600 text-indigo-600"; document.getElementById('tab-buoni').className = "flex-1 py-2 text-center font-semibold text-slate-500 border-b-2 border-transparent"; }
            else { document.getElementById('section-spesa').classList.add('hidden'); document.getElementById('section-buoni').classList.remove('hidden'); document.getElementById('tab-buoni').className = "flex-1 py-2 text-center font-semibold border-b-2 border-indigo-600 text-indigo-600"; document.getElementById('tab-spesa').className = "flex-1 py-2 text-center font-semibold text-slate-500 border-b-2 border-transparent"; }
        }
        async function caricaDatiDaGitHub() { try { const res = await fetch(`https://api.github.com/repos/${config.user}/${config.repo}/contents/data.json`, { headers: { 'Authorization': `token ${config.token}` } }); if (res.ok) { const json = await res.json(); const content = JSON.parse(atob(json.content)); dbData = { spesa: content.spesa || [], buoni: content.buoni || [], cestino: content.cestino || [] }; pulisciCestinoScaduto(); renderizzaTutto(); } } catch (e) { console.error("Errore", e); } }
        async function salvaDatiSuGitHub() { const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/data.json`; const headers = { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' }; const getRes = await fetch(url, { headers }); let sha = ''; if (getRes.ok) { const fileInfo = await getRes.json(); sha = fileInfo.sha; } const body = { message: "Aggiornamento dati", content: btoa(unescape(encodeURIComponent(JSON.stringify(dbData, null, 2)))), sha: sha ? sha : undefined }; await fetch(url, { method: 'PUT', headers, body: JSON.stringify(body) }); }
        function aggiungiSpesa() { const input = document.getElementById('nuovo-articolo'); if(!input.value.trim()) return; dbData.spesa.push({ id: Date.now(), testo: input.value.trim(), completato: false }); input.value = ''; salvaDatiSuGitHub(); renderizzaSpesa(); }
        function toggleSpesa(id) { const item = dbData.spesa.find(x => x.id === id); if(item) item.completato = !item.completato; salvaDatiSuGitHub(); renderizzaSpesa(); }
        function eliminaSpesa(id) { dbData.spesa = dbData.spesa.filter(x => x.id !== id); salvaDatiSuGitHub(); renderizzaSpesa(); }
        function renderizzaSpesa() { const lista = document.getElementById('lista-spesa'); lista.innerHTML = ''; dbData.spesa.forEach(item => { lista.innerHTML += `<li class="bg-white p-3 rounded-xl shadow-sm flex items-center justify-between"><span onclick="toggleSpesa(${item.id})" class="cursor-pointer select-none flex-1 ${item.completato ? 'line-through text-slate-400' : ''}">${item.testo}</span><button onclick="eliminaSpesa(${item.id})" class="text-slate-400 hover:text-red-500 px-2">🗑️</button></li>`; }); }
        function renderizzaBuoni() { 
            aggiornaSelectTitoli(); 
            const lista = document.getElementById('lista-buoni'); 
            lista.innerHTML = ''; 
            const oggi = new Date(); 
            oggi.setHours(0,0,0,0); 
            
            let countInScadenza = 0;

            dbData.buoni.forEach(b => { 
                const dataScad = new Date(b.scadenza); 
                dataScad.setHours(0,0,0,0); 
                const diffGiorni = Math.ceil((dataScad - oggi) / (1000 * 60 * 60 * 24)); 
                
                if (diffGiorni >= 0 && diffGiorni <= 7) {
                    countInScadenza++;
                }

                lista.innerHTML += `<div class="bg-white rounded-2xl p-4 shadow-sm space-y-2 border-2 ${diffGiorni < 0 ? 'border-transparent' : (diffGiorni <= 7 ? 'pulsing-border border-red-500' : 'border-transparent')}"><div class="flex justify-between items-center"><h3 class="font-bold text-slate-800">${b.titolo}</h3><span class="text-xs px-2 py-1 rounded font-medium ${diffGiorni < 0 ? 'bg-red-100 text-red-600' : 'bg-slate-100 text-slate-600'}">Scadenza: ${b.scadenza}</span></div><div class="relative cursor-pointer overflow-hidden rounded-xl bg-slate-900 h-48 flex items-center justify-center" onclick="apriImmagine('${b.url}', ${b.id})"><img src="${b.url}" class="w-full h-full object-cover ${diffGiorni < 0 ? 'grayscale-img opacity-60' : ''}">${diffGiorni < 0 ? '<div class="absolute inset-0 flex items-center justify-center"><div class="military-stamp">SCADUTO</div></div>' : ''}</div></div>`; 
            }); 

            // Aggiorna il badge nativo sulla Home se ci sono elementi in scadenza
            if ('setAppBadge' in navigator) {
                if (countInScadenza > 0) {
                    navigator.setAppBadge(countInScadenza).catch(() => {});
                } else {
                    navigator.clearAppBadge().catch(() => {});
                }
            }
        }
        function apriImmagine(url, id) { idBuonoSelezionato = id; document.getElementById('img-zoom').src = url; document.getElementById('modal-img').classList.remove('hidden'); }
        function chiudiImmagine() { document.getElementById('modal-img').classList.add('hidden'); }
        function spostaNelCestinoCorrente() { const index = dbData.buoni.findIndex(x => x.id === idBuonoSelezionato); if(index !== -1) { const buonoEliminato = dbData.buoni.splice(index, 1)[0]; buonoEliminato.deletedAt = new Date().toISOString(); dbData.cestino.push(buonoEliminato); salvaDatiSuGitHub(); chiudiImmagine(); renderizzaBuoni(); } }
        function apriCestino() { renderizzaCestino(); document.getElementById('modal-cestino').classList.remove('hidden'); }
        function chiudiCestino() { document.getElementById('modal-cestino').classList.add('hidden'); }
        function renderizzaCestino() { const container = document.getElementById('lista-cestino'); container.innerHTML = ''; dbData.cestino.forEach(b => { container.innerHTML += `<div class="flex items-center justify-between bg-slate-50 p-2 rounded-lg border"><div class="flex items-center gap-3"><img src="${b.url}" class="w-12 h-12 object-cover rounded"><div><h4 class="font-bold text-sm text-slate-700">${b.titolo}</h4><span class="text-xs text-slate-400">Scad: ${b.scadenza}</span></div></div><div class="flex gap-1"><button onclick="ripristinaBuono(${b.id})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1 rounded text-xs font-semibold">Ripristina</button><button onclick="eliminaDefinitivo(${b.id})" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1 rounded text-xs font-semibold">Elimina</button></div></div>`; }); }
        function ripristinaBuono(id) { const index = dbData.cestino.findIndex(x => x.id === id); if(index !== -1) { const item = dbData.cestino.splice(index, 1)[0]; delete item.deletedAt; dbData.buoni.push(item); salvaDatiSuGitHub(); renderizzaCestino(); renderizzaBuoni(); } }
        async function eliminaDefinitivo(id) { const index = dbData.cestino.findIndex(x => x.id === id); if(index !== -1) { const item = dbData.cestino.splice(index, 1)[0]; await rimuoviFileDaGitHub(item.path); salvaDatiSuGitHub(); renderizzaCestino(); } }
        async function svuotaCestinoTotale() { if(!confirm("Vuoi svuotare il cestino?")) return; for(const item of dbData.cestino) { await rimuoviFileDaGitHub(item.path); } dbData.cestino = []; salvaDatiSuGitHub(); renderizzaCestino(); }
        async function pulisciCestinoScaduto() { const ora = new Date(); let modificato = false; const nuoviCestino = []; for(const item of dbData.cestino) { const dataDel = new Date(item.deletedAt); if((ora - dataDel) / (1000 * 60 * 60 * 24) > 30) { await rimuoviFileDaGitHub(item.path); modificato = true; } else { nuoviCestino.push(item); } } if(modificato) { dbData.cestino = nuoviCestino; salvaDatiSuGitHub(); } }
        async function rimuoviFileDaGitHub(path) { try { const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${path}`; const headers = { 'Authorization': `token ${config.token}` }; const res = await fetch(url, { headers }); if(res.ok) { const fileInfo = await res.json(); await fetch(url, { method: 'DELETE', headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ message: "Eliminazione file", sha: fileInfo.sha }) }); } } catch(e) { console.error("Errore", e); } }
        function renderizzaTutto() { renderizzaSpesa(); renderizzaBuoni(); }
    </script>
</body>
</html>
