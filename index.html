<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesa-Smart 🖕</title>
    <!-- Tailwind CSS per una grafica moderna e responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
            Spesa-Smart 🖕
        </h1>
        <button onclick="openSettings()" class="text-sm bg-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-800 transition">
            ⚙️ Config
        </button>
    </header>

    <!-- Container principale -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24">
        
        <!-- Tab Navigation -->
        <div class="flex bg-slate-200 p-1 rounded-xl mb-6 shadow-inner">
            <button onclick="switchTab('spesa')" id="btn-spesa" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow text-indigo-600 transition">🛒 Spesa</button>
            <button onclick="switchTab('buoni')" id="btn-buoni" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 transition">🎟️ Buoni</button>
        </div>

        <!-- SEZIONE SPESA -->
        <div id="tab-spesa" class="space-y-4">
            <div class="flex gap-2">
                <input type="text" id="new-item" placeholder="Cosa serve comprare? (es. Latte)" class="flex-1 border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm">
                <button onclick="addSpesaItem()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-semibold shadow hover:bg-indigo-700 transition">Aggiungi</button>
            </div>
            <div id="lista-spesa" class="space-y-2">
                <!-- Elementi caricati dinamicamente -->
            </div>
        </div>

        <!-- SEZIONE BUONI SCONTO -->
        <div id="tab-buoni" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h2 class="font-bold text-slate-700">Nuovo Buono Sconto</h2>
                <input type="text" id="buono-titolo" placeholder="Titolo (es. Buono Esselunga 10€)" class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div class="flex gap-2">
                    <input type="date" id="buono-scadenza" class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="file" id="buono-foto" accept="image/*" class="w-1/2 text-xs text-slate-500 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>
                <button onclick="addBuono()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold shadow hover:bg-indigo-700 transition">Salva Buono</button>
            </div>
            <div id="lista-buoni" class="grid grid-cols-1 gap-3">
                <!-- Buoni caricati dinamicamente -->
            </div>
        </div>
    </main>

    <!-- Modale Impostazioni GitHub (Token e Repo) -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-xl">
            <h3 class="font-bold text-lg text-slate-800">Connessione GitHub</h3>
            <p class="text-xs text-slate-500">Inserisci i dati del tuo repository per sincronizzare spesa e foto direttamente sul web.</p>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Username GitHub</label>
                <input type="text" id="gh-owner" placeholder="es. ingandall-pixel" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Nome Repository</label>
                <input type="text" id="gh-repo" placeholder="es. spesa-smart" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">GitHub Personal Access Token (PAT)</label>
                <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeSettings()" class="flex-1 bg-slate-200 text-slate-700 py-2 rounded-xl font-semibold text-sm hover:bg-slate-300">Annulla</button>
                <button onclick="saveSettings()" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl font-semibold text-sm hover:bg-indigo-700">Salva e Connetti</button>
            </div>
        </div>
    </div>

    <!-- Script di gestione app e API GitHub -->
    <script>
        let dbData = { spesa: [], buoni: [] };
        let fileSha = null;

        function getConfig() {
            return {
                owner: localStorage.getItem('gh_owner'),
                repo: localStorage.getItem('gh_repo'),
                token: localStorage.getItem('gh_token')
            };
        }

        function openSettings() {
            const cfg = getConfig();
            document.getElementById('gh-owner').value = cfg.owner || '';
            document.getElementById('gh-repo').value = cfg.repo || '';
            document.getElementById('gh-token').value = cfg.token || '';
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            localStorage.setItem('gh_owner', document.getElementById('gh-owner').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
            localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
            closeSettings();
            loadDataFromGitHub();
        }

        function switchTab(tab) {
            if (tab === 'spesa') {
                document.getElementById('tab-spesa').classList.remove('hidden');
                document.getElementById('tab-buoni').classList.add('hidden');
                document.getElementById('btn-spesa').className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow text-indigo-600 transition";
                document.getElementById('btn-buoni').className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 transition";
            } else {
                document.getElementById('tab-spesa').classList.add('hidden');
                document.getElementById('tab-buoni').classList.remove('hidden');
                document.getElementById('btn-buoni').className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow text-indigo-600 transition";
                document.getElementById('btn-spesa').className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 transition";
            }
        }

        async function loadDataFromGitHub() {
            const cfg = getConfig();
            if (!cfg.owner || !cfg.repo || !cfg.token) {
                openSettings();
                return;
            }
            try {
                const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`, {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });
                if (res.ok) {
                    const json = await res.json();
                    fileSha = json.sha;
                    const decoded = JSON.parse(atob(json.content));
                    dbData = decoded;
                    renderUI();
                } else {
                    // Se data.json non esiste ancora, lo inizializziamo
                    dbData = { spesa: [], buoni: [] };
                    renderUI();
                }
            } catch (err) {
                console.error("Errore di caricamento:", err);
            }
        }

        async function saveDataToGitHub() {
            const cfg = getConfig();
            if (!cfg.owner || !cfg.repo || !cfg.token) {
                alert("Configura prima i dati di GitHub!");
                openSettings();
                return;
            }
            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(dbData, null, 2))));
            const bodyData = {
                message: "Aggiornamento dati Spesa-Smart",
                content: contentEncoded
            };
            if (fileSha) bodyData.sha = fileSha;

            try {
                const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${cfg.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });
                if (res.ok) {
                    const json = await res.json();
                    fileSha = json.content.sha;
                } else {
                    alert("Errore nel salvataggio su GitHub.");
                }
            } catch (err) {
                console.error("Errore salvataggio:", err);
            }
        }

        function renderUI() {
            // Render Spesa
            const listaSpesa = document.getElementById('lista-spesa');
            listaSpesa.innerHTML = '';
            dbData.spesaforEach((item, index) => {
                listaSpesa.innerHTML += `
                    <div class="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                        <span class="${item.completato ? 'line-through text-slate-400' : 'text-slate-700'} font-medium">${item.testo}</span>
                        <div class="flex gap-2">
                            <button onclick="toggleSpesa(${index})" class="text-xs px-2.5 py-1 rounded-lg ${item.completato ? 'bg-slate-100 text-slate-600' : 'bg-emerald-50 text-emerald-600 font-semibold'}">${item.completato ? 'Annulla' : 'Fatto'}</button>
                            <button onclick="deleteSpesa(${index})" class="text-xs bg-rose-50 text-rose-600 px-2.5 py-1 rounded-lg font-semibold">Elimina</button>
                        </div>
                    </div>
                `;
            });

            // Render Buoni
            const listaBuoni = document.getElementById('lista-buoni');
            listaBuoni.innerHTML = '';
            dbData.buoni.forEach((buono, index) => {
                listaBuoni.innerHTML += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex gap-3 items-center">
                        ${buono.foto ? `<img src="${buono.foto}" class="w-16 h-16 object-cover rounded-lg border">` : '<div class="w-16 h-16 bg-slate-100 rounded-lg flex items-center justify-center text-xs text-slate-400">No Foto</div>'}
                        <div class="flex-1">
                            <h4 class="font-bold text-sm text-slate-800">${buono.titolo}</h4>
                            <p class="text-xs text-slate-500">Scadenza: ${buono.scadenza || 'Nessuna'}</p>
                        </div>
                        <button onclick="deleteBuono(${index})" class="text-xs bg-rose-50 text-rose-600 px-2.5 py-1 rounded-lg font-semibold">Elimina</button>
                    </div>
                `;
            });
        }

        async function addSpesaItem() {
            const input = document.getElementById('new-item');
            if (!input.value.trim()) return;
            dbData.spesa.push({ testo: input.value.trim(), completato: false });
            input.value = '';
            renderUI();
            await saveDataToGitHub();
        }

        async function toggleSpesa(index) {
            dbData.spesa[index].completato = !dbData.spesa[index].completato;
            renderUI();
            await saveDataToGitHub();
        }

        async function deleteSpesa(index) {
            dbData.spesa.splice(index, 1);
            renderUI();
            await saveDataToGitHub();
        }

        async function addBuono() {
            const titolo = document.getElementById('buono-titolo').value.trim();
            const scadenza = document.getElementById('buono-scadenza').value;
            const fileInput = document.getElementById('buono-foto');

            if (!titolo) {
                alert("Inserisci un titolo per il buono.");
                return;
            }

            let fotoUrl = "";
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fotoUrl = await uploadImageToGitHub(file);
            }

            dbData.buoni.push({ titolo, scadenza, foto: fotoUrl });
            document.getElementById('buono-titolo').value = '';
            document.getElementById('buono-scadenza').value = '';
            fileInput.value = '';
            renderUI();
            await saveDataToGitHub();
        }

        async function uploadImageToGitHub(file) {
            const cfg = getConfig();
            const reader = new FileReader();
            return new Promise((resolve, reject) => {
                reader.onload = async function() {
                    const base64Content = reader.result.split(',')[1];
                    const fileName = `images/buono_${Date.now()}_${file.name}`;
                    const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${fileName}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${cfg.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: "Caricamento foto buono sconto",
                            content: base64Content
                        })
                    });
                    if (res.ok) {
                        const json = await res.json();
                        // Restituisce l'URL pubblico di GitHub Pages o il raw URL
                        resolve(`https://${cfg.owner}.github.io/${cfg.repo}/${fileName}`);
                    } else {
                        alert("Errore durante il caricamento della foto.");
                        resolve("");
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        async function deleteBuono(index) {
            dbData.buoni.splice(index, 1);
            renderUI();
            await saveDataToGitHub();
        }

        // Avvio caricamento dati all'apertura
        window.onload = loadDataFromGitHub;
    </script>
</body>
</html>
