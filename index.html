<!-- Sostituisci il blocco script precedente con questo -->
<script>
    // ... (tieni le variabili globali iniziali invariate)

    // NUOVA FUNZIONE: Aggiunta per forzare il drag su iOS
    function abilitaTouchDrag() {
        const items = document.querySelectorAll('#lista-spesa li');
        items.forEach(item => {
            // Forza il comportamento su mobile
            item.addEventListener('touchstart', (e) => {
                // Se l'utente tocca la riga, permettiamo il drag
                // Impediamo lo scroll solo se l'utente inizia a trascinare
                if (item.getAttribute('draggable') === 'true') {
                    item.style.touchAction = 'none'; 
                }
            }, {passive: false});
        });
    }

    // Modifica la funzione renderizzaSpesa per includere l'abilitazione
    function renderizzaSpesa() {
        const ul = document.getElementById('lista-spesa');
        ul.innerHTML = '';
        if (!db.spesa || db.spesa.length === 0) {
            ul.innerHTML = '<li class="py-3 text-center text-slate-400 text-sm">Nessun articolo presente.</li>';
            return;
        }
        db.spesa.forEach((item, index) => {
            const li = document.createElement('li');
            // AGGIORNAMENTO: Tutta la riga ora è il punto di presa
            li.className = "py-3 flex justify-between items-center text-sm border-b border-slate-100 bg-white";
            const completato = !!item.completato;
            
            if (!completato) {
                li.setAttribute('draggable', 'true');
                li.style.cursor = 'grab'; // Indica che è trascinabile
                li.dataset.index = index;
                li.addEventListener('dragstart', handleDragStart);
                li.addEventListener('dragover', handleDragOver);
                li.addEventListener('drop', handleDrop);
                li.addEventListener('dragend', handleDragEnd);
            }

            // ... (il resto dell'innerHTML rimane simile, ma ora puoi premere ovunque sulla riga)
            const stileTesto = completato 
                ? "line-through text-slate-400 italic flex-1 cursor-pointer" 
                : "font-medium text-slate-700 flex-1 cursor-pointer";

            li.innerHTML = `
                <div class="flex items-center gap-3 flex-1 min-w-0">
                    <span class="text-slate-300 font-bold text-lg select-none">☰</span>
                    <label class="flex items-center gap-2 flex-1 cursor-pointer">
                        <input type="checkbox" ${completato ? 'checked' : ''} onchange="toggleStatoSpesa(${index})" class="w-5 h-5 accent-indigo-600">
                        <span class="${stileTesto}">${item.nome}</span>
                    </label>
                </div>
                <button onclick="eliminaSpesa(${index})" class="text-slate-400 hover:text-red-600 px-2">🗑️</button>
            `;
            ul.appendChild(li);
        });
        
        // Forza l'attivazione del touch per ogni render
        abilitaTouchDrag();
    }
    
    // ... (mantenere le altre funzioni invariate)
</script>
