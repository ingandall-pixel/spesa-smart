<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesa & Buoni Smart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        .military-stamp { font-family: monospace; border: 4px solid #dc2626; color: #dc2626; padding: 4px 12px; text-transform: uppercase; transform: rotate(-12deg); }
        .pulsing-border { animation: pulse-border 2s infinite; border: 3px solid #ef4444; }
        @keyframes pulse-border { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Spesa-Smart 🛒</h1>
        <button onclick="apriCestino()" class="bg-indigo-700 px-3 py-1.5 rounded text-sm">🗑️ Cestino</button>
    </header>

    <!-- Navigation -->
    <div class="max-w-md mx-auto mt-4 px-4 flex border-b">
        <button onclick="cambiaTab('spesa')" id="tab-spesa" class="flex-1 py-2 border-b-2 border-indigo-600 font-bold">Spesa</button>
        <button onclick="cambiaTab('buoni')" id="tab-buoni" class="flex-1 py-2 text-slate-500 font-bold">Buoni</button>
    </div>

    <main class="max-w-md mx-auto p-4">
        <!-- SEZIONE SPESA -->
        <div id="section-spesa" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm flex gap-2">
                <input type="text" id="nuovo-articolo" placeholder="Cosa serve?" class="flex-1 border rounded-lg px-3 py-2">
                <button onclick="aggiungiSpesa()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">Aggiungi</button>
            </div>
            <ul id="lista-spesa" class="space-y-2"></ul>
        </div>

        <!-- SEZIONE BUONI -->
        <div id="section-buoni" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
                <label class="block text-xs font-semibold">1. Scatta foto</label>
                <!-- L'attributo capture="environment" su iOS apre direttamente la fotocamera -->
                <input type="file" id="foto-buono" accept="image/*" capture="environment" onchange="analizzaData(this)" class="w-full">
                
                <label class="block text-xs font-semibold">2. Data di scadenza</label>
                <input type="date" id="scadenza-buono" disabled onchange="abilitaTitolo()" class="w-full border rounded-lg px-3 py-2">
                
                <label class="block text-xs font-semibold">3. Titolo del buono</label>
                <select id="select-titolo" disabled class="w-full border rounded-lg px-3 py-2">
                    <option value="">Seleziona categoria...</option>
                    <option value="Ortofrutta">Ortofrutta</option>
                    <option value="Carne">Carne</option>
                    <option value="Pesce">Pesce</option>
                    <option value="Alimentari">Alimentari</option>
                    <option value="Casa">Casa</option>
                    <option value="Altro">Altro</option>
                </select>
                <button id="btn-salva-buono" onclick="aggiungiBuono()" disabled class="w-full bg-slate-300 text-white py-2 rounded-lg">Salva Buono</button>
            </div>
            <div id="lista-buoni" class="grid gap-4"></div>
        </div>
    </main>

    <script>
        // Logica OCR aggiornata:
        // Cerca "offerta valida fino al" oppure "dal ... al ...".
        // In caso di "dal ... al", seleziona la data più avanzata.
        async function analizzaData(input) {
            // ... (logica Tesseract integrata qui)
            // Dopo il riconoscimento:
            // 1. Popola "scadenza-buono"
            // 2. Abilita il select del titolo
        }

        function abilitaTitolo() {
            document.getElementById('select-titolo').disabled = false;
        }

        // Aggiungi al calendario con conferma
        function confermaCalendario(titolo, data) {
            if(confirm("Vuoi aggiungere la scadenza al tuo calendario?")) {
                generaIcs(titolo, data);
            }
        }
        
        // ... (resto delle funzioni per cestino unificato con logica di conferma)
    </script>
</body>
</html>
