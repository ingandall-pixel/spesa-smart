<body class="bg-slate-100 min-h-screen text-slate-800">
    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Spesa-Smart 🛒</h1>
        <button onclick="apriCestino()" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded text-sm font-medium transition">🗑️ Cestino</button>
    </header>

    <main class="max-w-md mx-auto p-4">
        <div id="section-buoni" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">1. Scatta foto del buono</label>
                    <input type="file" id="foto-buono" accept="image/*" capture="environment" onchange="analizzaData(this)" class="w-full text-sm file:bg-indigo-600 file:text-white file:py-2 file:px-4 file:rounded-lg file:border-0">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">2. Data di scadenza</label>
                    <input type="date" id="scadenza-buono" disabled oninput="toggleTitoloStatus()" class="w-full border rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">3. Titolo del buono</label>
                    <select id="select-titolo" disabled class="w-full border rounded-lg px-3 py-2 bg-white">
                        <option value="">Seleziona categoria...</option>
                        <option value="Ortofrutta">Ortofrutta</option>
                        <option value="Carne">Carne</option>
                        <option value="Pesce">Pesce</option>
                        <option value="Alimentari">Alimentari</option>
                        <option value="Casa">Casa</option>
                        <option value="Altro">Altro</option>
                    </select>
                </div>
                <button id="btn-salva-buono" onclick="aggiungiBuono()" disabled class="w-full bg-slate-300 text-slate-500 py-2 rounded-lg font-medium transition">Salva Buono</button>
            </div>
            <div id="lista-buoni" class="grid grid-cols-1 gap-4"></div>
        </div>
    </main>

    <!-- Modal Cestino -->
    <div id="modal-cestino" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 shadow-xl max-h-[85vh] flex flex-col">
            <h2 class="text-lg font-bold">🗑️ Cestino</h2>
            <div id="lista-cestino" class="overflow-y-auto flex-1 space-y-2"></div>
            <div class="pt-2 border-t flex gap-2">
                <button onclick="toggleSelezioneCestino()" id="btn-sel-cestino" class="bg-slate-200 px-3 py-2 rounded text-sm">Seleziona</button>
                <button onclick="selezionaTuttoCestino()" id="btn-sel-tutto" class="hidden bg-slate-200 px-3 py-2 rounded text-sm">Tutto</button>
                <button onclick="confermaCancellazione()" id="btn-del-cestino" disabled class="bg-red-600 text-white px-3 py-2 rounded text-sm disabled:opacity-50">Cancella</button>
            </div>
        </div>
    </div>
